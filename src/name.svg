<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="Mateus Nascimento">
  <defs>
    <linearGradient id="nameGradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#3828ca">
        <animate attributeName="stop-color" values="#3828ca;#ff006e;#7b2cff;#3828ca" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ff006e">
        <animate attributeName="stop-color" values="#ff006e;#ff2a9d;#3828ca;#ff006e" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#c300ff">
        <animate attributeName="stop-color" values="#c300ff;#3828ca;#ff006e;#c300ff" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="transparent"/>

  <g fill="#ffffff" opacity="0.95" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="80" y="-10" font-size="20">✻
      <animate attributeName="y" values="-10;165" dur="7.5s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="x" values="80;105;70;80" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="190" y="-20" font-size="16">❅
      <animate attributeName="y" values="-20;165" dur="9s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="190;160;210;190" dur="3.6s" repeatCount="indefinite"/>
    </text>
    <text x="320" y="-15" font-size="18">✻
      <animate attributeName="y" values="-15;165" dur="8s" begin="-6s" repeatCount="indefinite"/>
      <animate attributeName="x" values="320;350;300;320" dur="2.8s" repeatCount="indefinite"/>
    </text>
    <text x="445" y="-25" font-size="15">❅
      <animate attributeName="y" values="-25;165" dur="10s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="x" values="445;415;470;445" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="580" y="-10" font-size="20">✻
      <animate attributeName="y" values="-10;165" dur="8.7s" begin="-7s" repeatCount="indefinite"/>
      <animate attributeName="x" values="580;610;555;580" dur="3.2s" repeatCount="indefinite"/>
    </text>
    <text x="715" y="-20" font-size="16">❅
      <animate attributeName="y" values="-20;165" dur="9.6s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="x" values="715;680;740;715" dur="3.8s" repeatCount="indefinite"/>
    </text>
    <text x="850" y="-15" font-size="18">✻
      <animate attributeName="y" values="-15;165" dur="7.9s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="x" values="850;880;825;850" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="940" y="-25" font-size="15">❅
      <animate attributeName="y" values="-25;165" dur="10.5s" begin="-8s" repeatCount="indefinite"/>
      <animate attributeName="x" values="940;910;965;940" dur="4.2s" repeatCount="indefinite"/>
    </text>
  </g>

  <text
    x="500"
    y="102"
    text-anchor="middle"
    font-family="Inter, Segoe UI, Arial, Helvetica, sans-serif"
    font-size="72"
    font-weight="900"
    letter-spacing="-3"
    fill="url(#nameGradient)"
    filter="url(#softGlow)"
  >Mateus Nascimento</text>
</svg>
